        <script>
            function copyText(btnEl) {
                const textToCopy = btnEl.getAttribute("data-copy");
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert(`"${textToCopy}" copied to clipboard!`);
                }).catch((err) => {
                    console.error("Error copying text: ", err);
                });
            }
